<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kamera Absensi Wajah</title>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #020617;
      color: white;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 70px;
      background: #0f766e;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 10;
    }

    .header h1 {
      margin: 0;
      font-size: 23px;
    }

    .header p {
      margin: 4px 0 0;
      font-size: 13px;
    }

    .camera-area {
      position: relative;
      flex: 1;
      background: #020617;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .mode {
      position: absolute;
      top: 15px;
      left: 15px;
      padding: 10px 15px;
      border-radius: 10px;
      background: rgba(0,0,0,.70);
      font-size: 14px;
      font-weight: bold;
      z-index: 5;
    }

    .status-box {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      width: 92%;
      max-width: 650px;
      background: rgba(0,0,0,.78);
      padding: 14px;
      border-radius: 15px;
      text-align: center;
      z-index: 5;
    }

    #status {
      font-size: 17px;
      font-weight: bold;
    }

    #person {
      margin-top: 7px;
      color: #4ade80;
      font-size: 23px;
      font-weight: bold;
    }

    #loading {
      position: absolute;
      inset: 0;
      background: rgba(2,6,23,.96);
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255,255,255,.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .error {
      width: 90%;
      max-width: 600px;
      background: #7f1d1d;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div>
      <h1>📷 KAMERA ABSENSI WAJAH</h1>
      <p>SD Negeri 1 Juglangan</p>
    </div>
  </div>

  <div class="camera-area">

    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>

    <canvas id="canvas"></canvas>

    <div class="mode">
      MODE:
      <span id="modeText">MASUK</span>
    </div>

    <div class="status-box">

      <div id="status">
        Menyiapkan kamera...
      </div>

      <div id="person"></div>

    </div>

    <div id="loading">

      <div class="spinner"></div>

      <div id="loadingText">
        Memuat sistem pengenalan wajah...
      </div>

    </div>

  </div>

</div>


<script>

/* =====================================================
   ELEMENT
===================================================== */

const video =
  document.getElementById('video');

const canvas =
  document.getElementById('canvas');

const statusElement =
  document.getElementById('status');

const personElement =
  document.getElementById('person');

const loadingElement =
  document.getElementById('loading');

const loadingText =
  document.getElementById('loadingText');

const modeText =
  document.getElementById('modeText');


/* =====================================================
   VARIABEL
===================================================== */

let stream = null;

let running = false;

let detecting = false;

let modelsLoaded = false;

let students = [];

let faceMatcher = null;

let registerMode = false;

let currentMode = 'Masuk';

let latestDetection = null;

let lastAttendanceId = null;

let lastAttendanceTime = 0;


/* =====================================================
   KONFIGURASI
===================================================== */

const MODEL_URL =
  'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';

const MATCH_THRESHOLD = 0.48;

const ATTENDANCE_COOLDOWN = 10000;

const DETECTION_INTERVAL = 180;


/* =====================================================
   STATUS
===================================================== */

function setStatus(text) {

  statusElement.innerText = text;

}


/* =====================================================
   PARAMETER URL
===================================================== */

function getParams() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  currentMode =
    params.get('mode') || 'Masuk';

  registerMode =
    params.get('register') === '1';

  if (registerMode) {

    modeText.innerText =
      'REGISTRASI WAJAH';

  } else {

    modeText.innerText =
      currentMode.toUpperCase();

  }

}


/* =====================================================
   LOAD MODEL
===================================================== */

async function loadModels() {

  try {

    loadingText.innerText =
      'Memuat deteksi wajah...';

    await faceapi
      .nets
      .tinyFaceDetector
      .loadFromUri(MODEL_URL);

    loadingText.innerText =
      'Memuat landmark wajah...';

    await faceapi
      .nets
      .faceLandmark68Net
      .loadFromUri(MODEL_URL);

    loadingText.innerText =
      'Memuat pengenalan wajah...';

    await faceapi
      .nets
      .faceRecognitionNet
      .loadFromUri(MODEL_URL);

    modelsLoaded = true;

    console.log(
      'FACE API: MODEL SIAP'
    );

  } catch (error) {

    console.error(error);

    showError(
      'Model wajah gagal dimuat.<br><br>' +
      error.message
    );

    throw error;

  }

}


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera() {

  try {

    setStatus(
      'Meminta izin kamera...'
    );

    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: 'user'
            },

            width: {
              ideal: 640
            },

            height: {
              ideal: 480
            },

            frameRate: {
              ideal: 24,
              max: 30
            }

          },

          audio: false

        });


    video.srcObject =
      stream;


    await new Promise(
      function(resolve) {

        video.onloadedmetadata =
          function() {

            resolve();

          };

      }
    );


    await video.play();


    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    console.log(
      'KAMERA:',
      video.videoWidth,
      'x',
      video.videoHeight
    );


    setStatus(
      'Kamera aktif. Hadapkan wajah ke kamera.'
    );


  } catch (error) {

    console.error(error);

    showError(
      'Kamera tidak dapat digunakan.<br><br>' +
      'Pastikan izin kamera sudah diberikan.<br><br>' +
      error.message
    );

    throw error;

  }

}


/* =====================================================
   REQUEST DATA SISWA
===================================================== */

function requestStudents() {

  setStatus(
    'Mengambil data wajah siswa...'
  );


  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(
      {
        type: 'REQUEST_STUDENTS'
      },
      '*'
    );

  } else {

    showError(
      'Halaman utama absensi tidak ditemukan.'
    );

  }

}


/* =====================================================
   PESAN DARI INDEX.HTML
===================================================== */

window.addEventListener(
  'message',
  async function(event) {

    const data =
      event.data || {};


    /* DATA SISWA */

    if (
      data.type === 'STUDENTS'
    ) {

      students =
        Array.isArray(data.students)
          ? data.students
          : [];


      console.log(
        'DATA SISWA:',
        students.length
      );


      buildFaceMatcher();


      if (
        students.length === 0
      ) {

        setStatus(
          'Belum ada wajah siswa yang terdaftar.'
        );

      } else {

        setStatus(
          'Sistem siap. Hadapkan wajah ke kamera.'
        );

      }

    }


    /* HASIL */

    if (
      data.type === 'RESULT'
    ) {

      const result =
        data.result || {};


      if (
        result.success === false
      ) {

        setStatus(
          result.message ||
          'Proses gagal.'
        );

      } else {

        setStatus(
          '✅ BERHASIL'
        );


        personElement.innerText =
          result.name ||
          result.nama ||
          'Berhasil';


        setTimeout(
          function() {

            personElement.innerText =
              '';

            if (running) {

              setStatus(
                registerMode
                  ? 'Siap merekam wajah berikutnya.'
                  : 'Silakan hadapkan wajah berikutnya.'
              );

            }

          },
          3000
        );

      }

    }


    /* STOP */

    if (
      data.type === 'STOP'
    ) {

      stopCamera();

    }


    /* CAPTURE */

    if (
      data.type === 'CAPTURE'
    ) {

      await captureFace();

    }

  }
);


/* =====================================================
   BUILD FACE MATCHER
===================================================== */

function buildFaceMatcher() {

  const labeledDescriptors = [];


  students.forEach(
    function(student) {

      if (
        !student.descriptor
      ) {

        return;

      }


      try {

        let descriptor =
          student.descriptor;


        if (
          typeof descriptor === 'string'
        ) {

          descriptor =
            JSON.parse(descriptor);

        }


        if (
          Array.isArray(descriptor) &&
          descriptor.length === 128
        ) {

          const floatDescriptor =
            new Float32Array(
              descriptor
            );


          labeledDescriptors.push(

            new faceapi
              .LabeledFaceDescriptors(

                String(student.id),

                [
                  floatDescriptor
                ]

              )

          );

        }

      } catch (error) {

        console.error(
          'Descriptor tidak valid:',
          student.id,
          error
        );

      }

    }
  );


  if (
    labeledDescriptors.length > 0
  ) {

    faceMatcher =
      new faceapi.FaceMatcher(
        labeledDescriptors,
        MATCH_THRESHOLD
      );


    console.log(
      'FACE MATCHER SIAP:',
      labeledDescriptors.length
    );

  } else {

    faceMatcher = null;

    console.log(
      'BELUM ADA DESCRIPTOR'
    );

  }

}


/* =====================================================
   DETEKSI WAJAH
===================================================== */

async function detectFace() {

  if (
    !running ||
    detecting ||
    !modelsLoaded
  ) {

    return;

  }


  detecting = true;


  try {

    const detection =
      await faceapi

        .detectSingleFace(

          video,

          new faceapi
            .TinyFaceDetectorOptions({

              inputSize: 160,

              scoreThreshold: 0.45

            })

        )

        .withFaceLandmarks()

        .withFaceDescriptor();


    /* TIDAK ADA WAJAH */

    if (!detection) {

      latestDetection = null;

      drawEmptyBox();


      setStatus(

        registerMode

          ? 'Hadapkan wajah ke kamera untuk registrasi.'

          : 'Mencari wajah...'

      );


      personElement.innerText = '';


      detecting = false;

      scheduleDetection();

      return;

    }


    /* SIMPAN DETEKSI TERAKHIR */

    latestDetection =
      detection;


    /* GAMBAR KOTAK */

    drawFaceBox(
      detection
    );


    /* MODE REGISTRASI */

    if (registerMode) {

      setStatus(
        '✅ Wajah terdeteksi. Klik REKAM WAJAH.'
      );


      personElement.innerText =
        'Wajah siap direkam';


      detecting = false;

      scheduleDetection();

      return;

    }


    /* MODE ABSENSI */

    if (!faceMatcher) {

      setStatus(
        'Belum ada wajah siswa yang terdaftar.'
      );


      personElement.innerText = '';

      detecting = false;


      setTimeout(
        function() {

          scheduleDetection();

        },
        1000
      );

      return;

    }


    /* COCOKKAN WAJAH */

    const bestMatch =
      faceMatcher.findBestMatch(
        detection.descriptor
      );


    console.log(
      'MATCH:',
      bestMatch.label,
      bestMatch.distance
    );


    /* TIDAK DIKENALI */

    if (
      bestMatch.label === 'unknown'
    ) {

      setStatus(
        '❌ Wajah belum dikenali.'
      );


      personElement.innerText =
        'Tidak dikenali';


      detecting = false;


      setTimeout(
        function() {

          scheduleDetection();

        },
        500
      );


      return;

    }


    /* CARI DATA SISWA */

    const student =
      students.find(
        function(item) {

          return String(item.id) ===
            String(bestMatch.label);

        }
      );


    if (!student) {

      detecting = false;

      scheduleDetection();

      return;

    }


    personElement.innerText =
      student.name ||
      student.nama ||
      student.id;


    setStatus(
      'Wajah dikenali. Menyimpan absensi...'
    );


    /* CEGAH ABSENSI GANDA */

    const now =
      Date.now();


    if (
      lastAttendanceId === student.id &&
      (
        now -
        lastAttendanceTime
      ) <
      ATTENDANCE_COOLDOWN
    ) {

      detecting = false;


      setStatus(
        'Absensi sudah diproses.'
      );


      setTimeout(
        function() {

          scheduleDetection();

        },
        1500
      );


      return;

    }


    lastAttendanceId =
      student.id;

    lastAttendanceTime =
      now;


    /* KIRIM KE INDEX */

    if (
      window.opener &&
      !window.opener.closed
    ) {

      window.opener.postMessage(
        {
          type: 'MATCH',
          id: student.id,
          mode: currentMode
        },
        '*'
      );

    }


    detecting = false;


    setTimeout(
      function() {

        scheduleDetection();

      },
      2500
    );


  } catch (error) {

    console.error(
      'DETECTION ERROR:',
      error
    );


    detecting = false;


    setTimeout(
      function() {

        scheduleDetection();

      },
      500
    );

  }

}


/* =====================================================
   JADWALKAN DETEKSI
===================================================== */

function scheduleDetection() {

  if (!running) {
    return;
  }


  setTimeout(
    detectFace,
    DETECTION_INTERVAL
  );

}


/* =====================================================
   GAMBAR KOTAK WAJAH
===================================================== */

function drawFaceBox(detection) {

  const ctx =
    canvas.getContext('2d');

  const videoRect =
    video.getBoundingClientRect();

  const displayWidth =
    videoRect.width;

  const displayHeight =
    videoRect.height;

  const videoWidth =
    video.videoWidth;

  const videoHeight =
    video.videoHeight;


  if (
    !videoWidth ||
    !videoHeight
  ) {

    return;

  }


  /*
   * Karena video menggunakan
   * object-fit: cover.
   */

  const scale =
    Math.max(
      displayWidth / videoWidth,
      displayHeight / videoHeight
    );


  const renderedWidth =
    videoWidth * scale;

  const renderedHeight =
    videoHeight * scale;


  const offsetX =
    (displayWidth -
      renderedWidth) / 2;

  const offsetY =
    (displayHeight -
      renderedHeight) / 2;


  /*
   * Posisi wajah dari Face API.
   */

  const box =
    detection.detection.box;


  /*
   * Video mirror.
   * Posisi X dibalik.
   */

  const x =
    renderedWidth -
    (box.x + box.width) * scale +
    offsetX;

  const y =
    box.y * scale +
    offsetY;

  const width =
    box.width * scale;

  const height =
    box.height * scale;


  /*
   * Bersihkan canvas.
   */

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
   * Sesuaikan skala canvas
   * dengan ukuran layar.
   */

  const scaleX =
    canvas.width /
    displayWidth;

  const scaleY =
    canvas.height /
    displayHeight;


  ctx.save();


  ctx.scale(
    scaleX,
    scaleY
  );


  /*
   * Kotak wajah.
   */

  ctx.strokeStyle =
    '#22c55e';

  ctx.lineWidth =
    4;


  ctx.strokeRect(
    x,
    y,
    width,
    height
  );


  ctx.restore();

}


/* =====================================================
   HAPUS KOTAK
===================================================== */

function drawEmptyBox() {

  const ctx =
    canvas.getContext('2d');


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

}


/* =====================================================
   REKAM WAJAH
===================================================== */

async function captureFace() {

  if (!registerMode) {

    return;

  }


  /*
   * Gunakan descriptor yang sudah
   * tersedia dari deteksi terakhir.
   */

  if (!latestDetection) {

    setStatus(
      '❌ Wajah belum terdeteksi.'
    );

    return;

  }


  try {

    setStatus(
      '⏺ Merekam wajah...'
    );


    const descriptor =
      Array.from(
        latestDetection.descriptor
      );


    if (
      descriptor.length !== 128
    ) {

      setStatus(
        'Descriptor wajah tidak valid.'
      );

      return;

    }


    /*
     * Kirim descriptor ke Index.html.
     */

    if (
      window.opener &&
      !window.opener.closed
    ) {

      window.opener.postMessage(
        {
          type: 'REGISTER',
          descriptor: descriptor
        },
        '*'
      );


      setStatus(
        '✅ Wajah berhasil direkam. Menyimpan data...'
      );

    } else {

      setStatus(
        'Halaman utama tidak ditemukan.'
      );

    }


  } catch (error) {

    console.error(error);


    setStatus(
      'Gagal merekam wajah: ' +
      error.message
    );

  }

}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera() {

  running = false;

  detecting = false;

  latestDetection = null;


  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    stream = null;

  }


  if (video) {

    video.srcObject = null;

  }


  drawEmptyBox();


  setStatus(
    'Kamera telah dimatikan.'
  );


  personElement.innerText = '';

}


/* =====================================================
   ERROR
===================================================== */

function showError(message) {

  loadingElement.innerHTML =

    '<div class="error">' +

      '<b>⚠️ TERJADI KESALAHAN</b>' +

      '<br><br>' +

      message +

    '</div>';

}


/* =====================================================
   INITIALIZE
===================================================== */

async function initialize() {

  try {

    getParams();

    await loadModels();

    await startCamera();


    loadingElement.style.display =
      'none';


    running = true;


    requestStudents();


    setTimeout(
      function() {

        detectFace();

      },
      500
    );


  } catch (error) {

    console.error(
      'INITIALIZE ERROR:',
      error
    );

  }

}


/* =====================================================
   HALAMAN DIBUKA
===================================================== */

window.addEventListener(
  'load',
  function() {

    initialize();

  }
);


/* =====================================================
   HALAMAN DITUTUP
===================================================== */

window.addEventListener(
  'beforeunload',
  function() {

    stopCamera();

  }
);

</script>

</body>
</html>
